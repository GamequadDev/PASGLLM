services:
  postgres:
    image: postgres:16-alpine
    container_name: pasgllm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pasgllm
      POSTGRES_PASSWORD: pasgllm_password
      POSTGRES_DB: pasgllm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5-community
    container_name: pasgllm_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/pasgllm_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data: